[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dayz-texture-tool"
version = "0.4.1"
description = "Convert game texture dumps into DayZ-ready materials"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "MengYYY369" }]
requires-python = ">=3.10"
keywords = ["dayz", "texture", "pbr", "paa", "rvmat", "modding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "PySide6-Essentials>=6.12.0",
    "qtawesome>=1.4.2",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "blind-watermark>=0.4.4",
]

[project.scripts]
dayz-texture-tool = "dayz_texture_tool.app:main"

[project.urls]
Homepage = "https://github.com/MengYYY369/DayZ_Texture_Tool"
Repository = "https://github.com/MengYYY369/DayZ_Texture_Tool"
Issues = "https://github.com/MengYYY369/DayZ_Texture_Tool/issues"
Changelog = "https://github.com/MengYYY369/DayZ_Texture_Tool/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dayz_texture_tool.ui" = ["translations/*.qm", "translations/*.ts"]
